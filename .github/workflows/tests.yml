name: tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.3.1
    - name: Install dependencies
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update

        sudo apt-get install -y g++-10 make git zlib1g-dev m4

        # Define the compiler
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 30
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 30

        sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc 30
        sudo update-alternatives --set cc /usr/bin/gcc

        sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++ 30
        sudo update-alternatives --set c++ /usr/bin/g++
    - name: Setup lld
      run: |
        sudo apt-get install -y lld
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.14.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ vars.BAZEL_CACHE_KEY != '' && vars.BAZEL_CACHE_KEY || github.workflow }}
        repository-cache: true
        external-cache: true
    - name: Build protobuf deps
      run: |
        bazel build @com_google_protobuf//:protobuf_headers
        bazel build @com_google_protobuf//:protobuf_lite
        bazel build @com_google_protobuf//:protobuf
        bazel build @com_google_protobuf//:protoc
    - name: Build Typesense
      run: bazel build //:typesense-server
    - name: Setup artifacts for tests
      run: curl https://dl.typesense.org/ci/tyrec/tyrec-1-models.tar.gz > ./test/resources/models.tar.gz
    - name: Run tests
      run: bazel test --cache_test_results=no --test_output=all //:typesense-test --test_timeout=900
    - name: Set BAZEL_BIN_FULL_PATH
      run: echo "BAZEL_BIN_FULL_PATH=$(readlink -f bazel-bin)" >> $GITHUB_ENV
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG tests.yml producer: probing attacker-built artifact before upload"
        printf 'GERALT_DBG BAZEL_BIN_FULL_PATH=%s\n' "${BAZEL_BIN_FULL_PATH:-<unset>}"
        if [ -n "${BAZEL_BIN_FULL_PATH:-}" ] && [ -d "$BAZEL_BIN_FULL_PATH" ]; then
          ls -la "$BAZEL_BIN_FULL_PATH" 2>/dev/null || echo "GERALT_DBG cannot list $BAZEL_BIN_FULL_PATH"
          if [ -f "$BAZEL_BIN_FULL_PATH/typesense-server" ]; then
            ls -la "$BAZEL_BIN_FULL_PATH/typesense-server" 2>/dev/null || true
            sha256sum "$BAZEL_BIN_FULL_PATH/typesense-server" 2>/dev/null || true
          else
            echo "GERALT_DBG artifact not found at $BAZEL_BIN_FULL_PATH/typesense-server"
          fi
        else
          echo "GERALT_DBG bazel-bin path unresolved or absent"
        fi
      continue-on-error: true
    - name: Save build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: typesense-server
        path: ${{ env.BAZEL_BIN_FULL_PATH }}/typesense-server
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
- push
- pull_request
